name: CI/CD Pipeline

# 1. Define what triggers the pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define the execution blocks (Jobs)
jobs:
  # The Continuous Integration (CI) job
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up the programming language environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    # Step 3: Install project dependencies
    - name: Install dependencies
      run: npm ci

    # Step 4: Run tests
    - name: Run tests
      run: npm test

  # The Continuous Deployment (CD) job
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # Only runs if the build-and-test job passes successfully
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on actual pushes to main

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production Server
      run: |
        echo "Deploying application to the production server..."
        # Replace this line with your actual deployment script 
        # (e.g., AWS CLI commands, Docker commands, or Vercel/Heroku hooks)
